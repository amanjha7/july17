<div class="code-card" *ngIf="code">
  <div class="code-header">
    <span class="title">HTML Code Snippet</span>
    <button class="copy-btn" (click)="copyCode()">
      <i class="fa-solid fa-copy"></i> Copy
    </button>
  </div>

  <pre><code class="language-html" [textContent]="code"></code></pre>

  <div class="copied-toast" *ngIf="copied">Copied ✅</div>
</div>
